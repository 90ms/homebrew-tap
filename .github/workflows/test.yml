name: Test Homebrew packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    name: Build and test ${{ matrix.package }} Formula
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: pr-review-reminder
            runner: macos-15
          - package: tokeni-bar
            runner: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Register checked-out tap
        run: brew tap 90ms/tap "$GITHUB_WORKSPACE"

      - name: Use standalone Command Line Tools
        if: ${{ matrix.package == 'tokeni-bar' }}
        run: |
          test -d /Library/Developer/CommandLineTools
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          swift --version

      - name: Install Formula from source
        run: brew install --build-from-source "90ms/tap/${{ matrix.package }}"

      - name: Test Formula
        run: brew test "90ms/tap/${{ matrix.package }}"

      - name: Audit Formula
        run: brew audit --strict "90ms/tap/${{ matrix.package }}"

  cask:
    name: Install and audit ${{ matrix.package }} Cask
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: agents-status-bar
            app: Agents Status Bar
            executable: AgentsStatusBar
          - package: tokeni-bar
            app: Tokeni Bar
            executable: TokeniBar

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Register checked-out tap
        run: brew tap 90ms/tap "$GITHUB_WORKSPACE"

      - name: Install Cask
        run: brew install --cask "90ms/tap/${{ matrix.package }}"

      - name: Validate installed application
        shell: bash
        run: |
          set -euo pipefail
          app="/Applications/${{ matrix.app }}.app"
          test -x "$app/Contents/MacOS/${{ matrix.executable }}"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"

      - name: Audit Cask
        run: brew audit --strict --cask "90ms/tap/${{ matrix.package }}"

      - name: Uninstall Cask
        run: brew uninstall --cask "${{ matrix.package }}"
