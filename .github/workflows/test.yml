name: Test Homebrew packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    name: Build and test PR Review Reminder Formula
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Register checked-out tap
        run: brew tap 90ms/tap "$GITHUB_WORKSPACE"

      - name: Install Formula from source
        run: brew install --build-from-source 90ms/tap/pr-review-reminder

      - name: Test Formula
        run: brew test 90ms/tap/pr-review-reminder

      - name: Audit Formula
        run: brew audit --strict 90ms/tap/pr-review-reminder

  cask:
    name: Install and audit Agents Status Bar Cask
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Register checked-out tap
        run: brew tap 90ms/tap "$GITHUB_WORKSPACE"

      - name: Install Cask
        run: brew install --cask 90ms/tap/agents-status-bar

      - name: Validate installed application
        shell: bash
        run: |
          set -euo pipefail
          app="/Applications/Agents Status Bar.app"
          test -x "$app/Contents/MacOS/AgentsStatusBar"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"

      - name: Audit Cask
        run: brew audit --strict --cask 90ms/tap/agents-status-bar

      - name: Uninstall Cask
        run: brew uninstall --cask agents-status-bar
